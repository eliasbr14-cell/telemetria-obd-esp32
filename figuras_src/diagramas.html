<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif}
  svg{display:block;margin:0}
  .t{font-size:15px;fill:#111}.s{font-size:12.5px;fill:#444}.b{font-weight:700}
  .cx{fill:#fff;stroke:#222;stroke-width:1.6}.ac{fill:#e9f3fb;stroke:#1f5f8b;stroke-width:1.6}
  .gr{fill:#f3f3f3;stroke:#888;stroke-width:1.2;stroke-dasharray:5 4}
  .l{stroke:#222;stroke-width:1.6;fill:none}.la{stroke:#1f5f8b;stroke-width:2;fill:none}
</style></head><body>

<!-- FIGURA: ARQUITETURA -->
<svg id="arquitetura" width="1100" height="520" viewBox="0 0 1100 520">
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
  <!-- camadas -->
  <text x="20" y="28" class="t b">(i) Aquisição</text>
  <text x="380" y="28" class="t b">(ii) Transporte</text>
  <text x="600" y="28" class="t b">(iii) Processamento e armazenamento</text>
  <text x="900" y="28" class="t b">(iv) Apresentação</text>

  <rect x="20" y="50" width="330" height="200" rx="8" class="gr"/>
  <text x="32" y="72" class="s b">Cenário A — veículo real</text>
  <rect x="40" y="90" width="120" height="70" rx="6" class="cx"/><text x="100" y="120" text-anchor="middle" class="t">ECU</text><text x="100" y="140" text-anchor="middle" class="s">(injeção)</text>
  <rect x="210" y="90" width="120" height="70" rx="6" class="ac"/><text x="270" y="115" text-anchor="middle" class="t">ESP32</text><text x="270" y="133" text-anchor="middle" class="s">+ SN65HVD230</text><text x="270" y="150" text-anchor="middle" class="s">(firmware)</text>
  <path d="M160 125 H208" class="l" marker-end="url(#m)" marker-start="url(#m)"/>
  <text x="184" y="182" text-anchor="middle" class="s">CAN 500 kbit/s</text><text x="184" y="198" text-anchor="middle" class="s">conector OBD-II</text>
  <text x="270" y="218" text-anchor="middle" class="s">ou modo AUTOTESTE</text><text x="270" y="234" text-anchor="middle" class="s">(TWAI loopback)</text>

  <rect x="20" y="280" width="330" height="200" rx="8" class="gr"/>
  <text x="32" y="302" class="s b">Cenário B — ambiente simulado (validação)</text>
  <rect x="40" y="320" width="120" height="70" rx="6" class="cx"/><text x="100" y="348" text-anchor="middle" class="t">ECU simulada</text><text x="100" y="368" text-anchor="middle" class="s">modelo de veículo</text>
  <rect x="210" y="320" width="120" height="70" rx="6" class="ac"/><text x="270" y="348" text-anchor="middle" class="t">Leitor OBD</text><text x="270" y="368" text-anchor="middle" class="s">(lógica do firmware)</text>
  <path d="M160 355 H208" class="l" marker-end="url(#m)" marker-start="url(#m)"/>
  <text x="184" y="412" text-anchor="middle" class="s">barramento CAN virtual</text><text x="184" y="428" text-anchor="middle" class="s">(python-can)</text>

  <!-- broker -->
  <rect x="400" y="215" width="150" height="90" rx="8" class="cx"/>
  <text x="475" y="250" text-anchor="middle" class="t">Broker MQTT</text><text x="475" y="270" text-anchor="middle" class="s">Mosquitto</text><text x="475" y="288" text-anchor="middle" class="s">porta 1883</text>
  <path d="M330 125 C 380 125, 380 235, 398 240" class="l" marker-end="url(#m)"/>
  <path d="M330 355 C 380 355, 380 285, 398 280" class="l" marker-end="url(#m)"/>
  <text x="398" y="200" class="s" text-anchor="start">Wi-Fi</text>
  <text x="500" y="345" text-anchor="middle" class="s">tópicos:</text>
  <text x="500" y="362" text-anchor="middle" class="s">telemetria/polo/dados (QoS 0)</text>
  <text x="500" y="379" text-anchor="middle" class="s">telemetria/polo/dtc (QoS 1)</text>

  <!-- servidor -->
  <rect x="600" y="170" width="250" height="180" rx="8" class="cx"/>
  <text x="725" y="196" text-anchor="middle" class="t b">Servidor (Python)</text>
  <rect x="620" y="210" width="210" height="36" rx="5" class="ac"/><text x="725" y="233" text-anchor="middle" class="s">Assinante MQTT (paho-mqtt)</text>
  <rect x="620" y="256" width="210" height="36" rx="5" class="ac"/><text x="725" y="279" text-anchor="middle" class="s">Banco de dados SQLite</text>
  <rect x="620" y="302" width="210" height="36" rx="5" class="ac"/><text x="725" y="325" text-anchor="middle" class="s">API HTTP + SSE (Flask)</text>
  <path d="M550 260 H598" class="l" marker-end="url(#m)"/>

  <!-- dashboard -->
  <rect x="900" y="200" width="180" height="120" rx="8" class="cx"/>
  <rect x="915" y="215" width="150" height="70" rx="4" fill="#20252c"/>
  <path d="M935 270 A 30 30 0 0 1 995 270" stroke="#4fb3ff" stroke-width="6" fill="none"/>
  <rect x="1010" y="235" width="45" height="7" fill="#3ddc84"/><rect x="1010" y="250" width="30" height="7" fill="#4fb3ff"/>
  <text x="990" y="305" text-anchor="middle" class="s">Dashboard web</text>
  <path d="M850 260 H898" class="l" marker-end="url(#m)"/>
  <text x="874" y="250" text-anchor="middle" class="s">SSE</text>
</svg>

<!-- FIGURA: LIGAÇÃO ELÉTRICA -->
<svg id="ligacao" width="1000" height="430" viewBox="0 0 1000 430">
  <rect x="30" y="40" width="240" height="340" rx="10" class="cx"/>
  <text x="150" y="70" text-anchor="middle" class="t b">ESP32 DevKit</text>
  <g class="s">
    <text x="250" y="130" text-anchor="end">3V3</text><text x="250" y="180" text-anchor="end">GND</text>
    <text x="250" y="230" text-anchor="end">GPIO5 (TWAI TX)</text><text x="250" y="280" text-anchor="end">GPIO4 (TWAI RX)</text>
    <text x="150" y="350" text-anchor="middle">USB 5 V (alimentação/serial)</text>
  </g>
  <rect x="390" y="90" width="210" height="230" rx="10" class="ac"/>
  <text x="495" y="118" text-anchor="middle" class="t b">SN65HVD230</text>
  <g class="s">
    <text x="405" y="130">VCC</text><text x="405" y="180">GND</text><text x="405" y="230">CTX (D)</text><text x="405" y="280">CRX (R)</text>
    <text x="585" y="180" text-anchor="end">CANH</text><text x="585" y="230" text-anchor="end">CANL</text>
  </g>
  <path d="M270 126 H390" class="l"/><path d="M270 176 H390" class="l"/>
  <path d="M270 226 H390" class="la"/><path d="M270 276 H390" class="la"/>
  <!-- OBD connector -->
  <g transform="translate(700,110)">
    <path d="M0 0 H260 L240 120 H20 Z" class="cx"/>
    <text x="130" y="-45" text-anchor="middle" class="t b">Conector OBD-II (SAE J1962)</text>
    <g font-size="12">
      <!-- linha superior 1..8 -->
      <g id="lin1"></g>
    </g>
  </g>
  <path d="M600 176 H870 V160" class="la"/>
  <path d="M600 226 H690 V250 H870 V202" class="la"/>
  <path d="M330 176 V85 H831 V141" class="l" stroke-dasharray="6 4"/>
  <text x="580" y="78" class="s" text-anchor="middle">GND comum (pinos 4/5)</text>
  <text x="845" y="330" class="s" text-anchor="middle">Pino 16: +12 V bateria (não utilizado</text>
  <text x="845" y="346" class="s" text-anchor="middle">no protótipo; exige regulador)</text>
</svg>

<!-- FIGURA: QUADRO CAN -->
<svg id="quadro" width="820" height="120" viewBox="0 0 820 120"><g id="campos"></g></svg>

<!-- FIGURA: FLUXOGRAMA -->
<svg id="fluxo" width="1100" height="330" viewBox="0 0 1100 330">
  <defs><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
  <g id="etapas"></g>
</svg>

<!-- FIGURA: SEQUÊNCIA OBD -->
<svg id="sequencia" width="1000" height="420" viewBox="0 0 1000 420">
  <defs><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
  <rect x="60" y="20" width="200" height="44" rx="6" class="ac"/><text x="160" y="47" text-anchor="middle" class="t b">ESP32 (testador)</text>
  <rect x="740" y="20" width="200" height="44" rx="6" class="cx"/><text x="840" y="47" text-anchor="middle" class="t b">ECU do motor</text>
  <path d="M160 64 V400" class="l" stroke-dasharray="4 4"/><path d="M840 64 V400" class="l" stroke-dasharray="4 4"/>
  <path d="M160 110 H836" class="l" marker-end="url(#m3)"/>
  <text x="500" y="100" text-anchor="middle" class="t">Requisição — ID 0x7DF (funcional), Modo 01, PID 0x0C</text>
  <g id="req"></g>
  <text x="870" y="215" class="s">tempo de</text><text x="870" y="231" class="s">processamento</text><text x="870" y="247" class="s">(≤ 50 ms, P2)</text>
  <path d="M840 270 H164" class="l" marker-end="url(#m3)"/>
  <text x="500" y="260" text-anchor="middle" class="t">Resposta — ID 0x7E8, Modo 0x41, PID 0x0C, A = 0x1A, B = 0xF8</text>
  <g id="resp"></g>
  <text x="500" y="390" text-anchor="middle" class="t">RPM = (256·A + B) / 4 = (256·26 + 248) / 4 = 1726 rpm</text>
</svg>

<script>
const NS="http://www.w3.org/2000/svg";
function el(p,tag,a,txt){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e;}
// pinos OBD
(function(){const g=document.getElementById("lin1");
 for(let i=0;i<8;i++){const x=40+i*26,y=40,pin=i+1;const ativo=[4,5,6].includes(pin)||pin==16;
   el(g,"circle",{cx:x,cy:y,r:9,fill:ativo?"#1f5f8b":"#fff",stroke:"#222"});el(g,"text",{x:x,y:y-14,"text-anchor":"middle",fill:"#333"},pin);}
 for(let i=0;i<8;i++){const x=40+i*26,y=82,pin=i+9;const ativo=[14,16].includes(pin);
   el(g,"circle",{cx:x,cy:y,r:9,fill:ativo?"#1f5f8b":"#fff",stroke:"#222"});el(g,"text",{x:x,y:y+26,"text-anchor":"middle",fill:"#333"},pin);}
 const leg=[["4/5","GND"],["6","CAN-H"],["14","CAN-L"],["7/15","K/L-Line (ISO 9141/14230)"],["16","+12 V"]];
})();
// rótulos dos pinos 6 e 14 posicionados
(function(){const s=document.getElementById("ligacao");
 el(s,"text",{x:845,y:280,"text-anchor":"middle",class:"s"},"Pino 6 = CAN-H · Pino 14 = CAN-L · Pino 7 = K-Line");})();
// quadro CAN
(function(){const g=document.getElementById("campos");
 const c=[["SOF",1],["ID",11],["RTR",1],["IDE",1],["r0",1],["DLC",4],["Dados",64],["CRC",15],["D",1],["ACK",1],["D",1],["EOF",7],["IFS",3]];
 const W=800, base=46, extra=W-base*c.length, tot=111; let x=10;
 c.forEach(([n,b])=>{const w=base+extra*b/tot; const cls=(n=="Dados"||n=="ID")?"ac":"cx";
   el(g,"rect",{x:x,y:10,width:w,height:76,class:cls});
   el(g,"text",{x:x+w/2,y:44,"text-anchor":"middle","font-size":17,fill:"#111"},n);
   el(g,"text",{x:x+w/2,y:70,"text-anchor":"middle","font-size":15,fill:"#444"},b+(b==64?" bits (0–8 bytes)":""));
   x+=w;});
 el(g,"text",{x:10,y:112,"font-size":14,fill:"#444"},"Número de bits por campo. ID = identificador (11 bits); D = delimitador; IFS = intervalo entre quadros.");})();
// fluxograma
(function(){const g=document.getElementById("etapas");
 const e=[["1. Revisão","bibliográfica e","normas (SAE/ISO)"],["2. Projeto da","arquitetura e da","ligação elétrica"],["3. Firmware","ESP32 (TWAI,","PIDs, DTCs, MQTT)"],["4. Simulação","ECU virtual +","barramento CAN"],["5. Backend e","dashboard","(MQTT, SQLite)"],["6. Ensaios","E1, E2 e E3","(simulação)"],["7. Análise","dos resultados","e discussão"]];
 const w=134,h=96,gap=22; e.forEach((t,i)=>{const x=10+i*(w+gap),y=110;
  el(g,"rect",{x:x,y:y,width:w,height:h,rx:8,class:i==3||i==5?"ac":"cx"});
  t.forEach((l,k)=>el(g,"text",{x:x+w/2,y:y+32+k*20,"text-anchor":"middle",class:k==0?"t b":"s"},l));
  if(i<e.length-1) el(g,"path",{d:`M${x+w} ${y+h/2} H${x+w+gap-2}`,class:"l","marker-end":"url(#m2)"});});
 el(g,"path",{d:"M 950 206 V 260 H 553 V 208",class:"l","stroke-dasharray":"6 4","marker-end":"url(#m2)"});
 el(g,"text",{x:750,y:282,"text-anchor":"middle",class:"s"},"ajustes iterativos do firmware/simulação a partir dos resultados");
 el(g,"text",{x:10,y:60,class:"t b"},"Etapas do desenvolvimento e da validação");})();
// bytes requisição e resposta
function bytes(id,y,arr,rot){const g=document.getElementById(id);const w=78;arr.forEach((b,i)=>{const x=190+i*w;
  el(g,"rect",{x:x,y:y,width:w-4,height:44,class:i<3||(id=="resp"&&i<5)?"ac":"cx"});
  el(g,"text",{x:x+(w-4)/2,y:y+20,"text-anchor":"middle",class:"t"},b);el(g,"text",{x:x+(w-4)/2,y:y+37,"text-anchor":"middle",class:"s"},rot[i]);});}
bytes("req",130,["02","01","0C","00","00","00","00","00"],["nº bytes","modo","PID","—","—","—","—","—"]);
bytes("resp",290,["04","41","0C","1A","F8","55","55","55"],["nº bytes","modo+40h","PID","A","B","pad.","pad.","pad."]);
</script>
</body></html>
