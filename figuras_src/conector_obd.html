<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif}</style></head><body>

<path d="M40 70 H460 L425 270 H75 Z" fill="#f4f4f4" stroke="#222" stroke-width="2.5"/>
<g id="pinos"></g>
<g font-size="15" id="leg"></g>
</svg>
<script>
const NS="http://www.w3.org/2000/svg";function el(p,t,a,x){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(x!=null)e.textContent=x;p.appendChild(e);return e;}
const g=document.getElementById('pinos');

for(let i=0;i<8;i++){const x=95+i*45,y=205,p=i+9;el(g,'circle',{cx:x,cy:y,r:15,fill:usados[p]||'#fff',stroke:'#222','stroke-width':2});el(g,'text',{x:x,y:y+38,'text-anchor':'middle','font-size':15},p);}
const L=document.getElementById('leg');
const itens=[['#1f5f8b','4 e 5 — terra (chassi e sinal)','usado'],['#1f5f8b','6 — CAN-H (ISO 15765-4)','usado'],['#1f5f8b','14 — CAN-L (ISO 15765-4)','usado'],['#d9822b','16 — +12 V da bateria','previsto (alimentação futura)'],['#9a9a9a','7 e 15 — K-Line / L-Line (ISO 9141-2, ISO 14230-4)','não utilizado'],['#cfcfcf','2 e 10 — SAE J1850','não utilizado'],['#fff','demais — uso livre do fabricante','']];
itens.forEach((it,k)=>{const y=82+k*44;el(L,'circle',{cx:530,cy:y,r:11,fill:it[0],stroke:'#222','stroke-width':1.5});el(L,'text',{x:552,y:y+5},it[1]);el(L,'text',{x:552,y:y+24,fill:'#666','font-size':13},it[2]);});
el(document.getElementById('obd'),'text',{x:40,y:310,'text-anchor':'start','font-size':14,fill:'#444'},'Vista frontal. O plugue do protótipo é a contraparte macho.');
</script></body></html>
